name: CI

on:
  push:
  pull_request:
  workflow_call:

# github.event_name differs between a standalone trigger (push/pull_request)
# and this workflow being invoked by deploy.yml (workflow_call), so the two
# never share a group and cancel each other out.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so golangci-lint's only-new-issues has a base to diff
          # against (a shallow clone would have nothing to compare).
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # CI resolves Go from go.mod, so a Dockerfile pinned to an older image
      # still passes every check here and only fails during the deploy build.
      - name: Dockerfile Go version covers go.mod
        run: |
          required="$(go mod edit -json | sed -n 's/.*"Go": "\([0-9]*\.[0-9]*\).*/\1/p' | head -1)"
          image="$(sed -n 's/^FROM golang:\([0-9]*\.[0-9]*\).*/\1/p' Dockerfile | head -1)"
          echo "go.mod needs $required, Dockerfile provides $image"
          if [ -z "$required" ] || [ -z "$image" ]; then
            echo "::error::could not parse a Go version from go.mod or Dockerfile"
            exit 1
          fi
          # Sorts both and checks the required version is not the strictly higher one.
          if [ "$(printf '%s\n%s\n' "$required" "$image" | sort -V | tail -1)" != "$image" ] \
             && [ "$required" != "$image" ]; then
            echo "::error::Dockerfile golang:$image is older than go.mod's $required; the deploy build will fail"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          only-new-issues: true

      - name: Build
        run: go build ./...

      - name: Test
        run: ENVIRONMENT=test go test -v ./...

      # Catches a v2 handler whose annotations changed without docs/openapi.json
      # being regenerated, which would leave the frontend's generated client
      # built from a stale contract.
      - name: API spec is up to date
        run: make spec-check

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
